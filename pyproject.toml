[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lecoach"
version = "0.1.0"
description = "Local presentation rehearsal integration scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "websockets>=14,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
lecoach = "lecoach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lecoach"]

[tool.hatch.build.targets.wheel.force-include]
"checks/coaching/fixtures" = "lecoach/fixture_data/fixtures"
"checks/coaching/expectations.json" = "lecoach/fixture_data/expectations.json"

[tool.pytest.ini_options]
testpaths = ["tests", "checks/coaching", "checks/speech"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"checks/coaching/*" = ["E", "I"]
